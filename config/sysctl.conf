# Buffers sized for QUIC / Hysteria2: the default 208 KB rmem_max caps its 20 MB window.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.ipv4.udp_rmem_min = 8192
net.ipv4.udp_wmem_min = 8192
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# Keep the congestion window after idle, so games and calls do not stall after a pause.
net.ipv4.tcp_slow_start_after_idle = 0
# Cloudflare kept full speed at 466 ms RTT with 128 KB; 16 KB throttles long fat links.
net.ipv4.tcp_notsent_lowat = 131072

net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq

net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 8192
net.core.somaxconn = 8192
net.core.netdev_max_backlog = 16384

# Many concurrent users. A bridge dials every connection to one exit address and a node to one WARP endpoint,
# so TIME_WAIT sockets of that one destination would otherwise hold its ports for a minute.
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
fs.file-max = 1000000

# Go 1.24+ listens with MPTCP by default, and a listening IPv4 MPTCP socket gave remote root on unpatched kernels
# (XTLS/Xray-core#7291): the panel and the decoy are Go programs too.
net.mptcp.enabled = 0
